# Render Blueprint — deploy StudyNotes (Blazor Server) with a managed PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: studynotes
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: studynotes-db
          property: connectionString

databases:
  - name: studynotes-db
    plan: free
    databaseName: studynotes
    user: studynotes